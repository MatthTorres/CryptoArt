<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd24d"/>
      <stop offset="0.5" stop-color="#f2a900"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="mpPulse" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#17e6b0"/>
      <stop offset="1" stop-color="#21d97f"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mpGrad)"/>

  <!-- Lingotes de oro apilados (trapecios, base más ancha) -->
  <g fill="#0b0f1a">
    <path d="M 14 46 h 16 l -3.5 -9 h -9 z" opacity="0.9"/>
    <path d="M 34 46 h 16 l -3.5 -9 h -9 z" opacity="0.9"/>
    <path d="M 24 36 h 16 l -3.5 -9 h -9 z" opacity="0.9"/>
  </g>

  <!-- Brillo en los lingotes -->
  <g fill="#ffffff" opacity="0.18">
    <path d="M 18 42 h 6 l 1 -4 h -5 z"/>
    <path d="M 38 42 h 6 l 1 -4 h -5 z"/>
    <path d="M 28 32 h 6 l 1 -4 h -5 z"/>
  </g>

  <!-- Línea de pulso ascendente (EKG/mercado) -->
  <path d="M 8 54 L 16 54 L 20 46 L 26 52 L 32 40 L 38 48 L 44 34 L 50 42 L 56 22"
        stroke="url(#mpPulse)" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="56" cy="22" r="3" fill="#17e6b0"/>
</svg>
