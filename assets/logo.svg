<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="caGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a900"/>
      <stop offset="0.55" stop-color="#17e6b0"/>
      <stop offset="1" stop-color="#0ea5a0"/>
    </linearGradient>
    <linearGradient id="caBrush" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#caGrad)"/>

  <!-- Trazo de pincel ascendente (arte) -->
  <path d="M10 50 C 20 47, 28 40, 35 31 C 41 23, 47 17, 55 13
           L 55 19 C 48 22, 43 27, 37 35 C 30 44, 22 51, 12 55 Z"
        fill="url(#caBrush)"/>

  <!-- Velas japonesas (cripto) -->
  <g fill="#0b0f1a">
    <!-- vela 1 (bajista) -->
    <rect x="14" y="34" width="3" height="16" rx="1.2" opacity="0.35"/>
    <rect x="11" y="38" width="9" height="8" rx="2"/>
    <!-- vela 2 (alcista) -->
    <rect x="30" y="26" width="3" height="18" rx="1.2" opacity="0.35"/>
    <rect x="27" y="30" width="9" height="11" rx="2"/>
    <!-- vela 3 (alcista) -->
    <rect x="46" y="18" width="3" height="16" rx="1.2" opacity="0.35"/>
    <rect x="43" y="21" width="9" height="10" rx="2"/>
  </g>

  <!-- Puntos de conexión estilo red/blockchain -->
  <circle cx="15.5" cy="30" r="2" fill="#0b0f1a" opacity="0.55"/>
  <circle cx="31.5" cy="22" r="2" fill="#0b0f1a" opacity="0.55"/>
  <circle cx="47.5" cy="14" r="2" fill="#0b0f1a" opacity="0.55"/>
</svg>
